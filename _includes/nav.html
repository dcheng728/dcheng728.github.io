<header class="topbar">
  <div class="topbar-inner">

    {% assign current_url = page.url | replace: 'index.html', '' %}
    <nav class="nav-links">
      <a class="brand{% if current_url == '/' %} is-active{% endif %}" href="{{ '/' | relative_url }}"{% if current_url == '/' %} aria-current="page"{% endif %}>{{ site.title }}</a>
      <a class="{% if current_url == '/physics-study/' %}is-active{% endif %}" href="{{ '/physics-study/' | relative_url }}"{% if current_url == '/physics-study/' %} aria-current="page"{% endif %}>Physics Self-Study</a>
      <a class="{% if current_url == '/ml-projects/' %}is-active{% endif %}" href="{{ '/ml-projects/' | relative_url }}"{% if current_url == '/ml-projects/' %} aria-current="page"{% endif %}>AI/ML Projects</a>
    </nav>

    <div class="social-links" aria-label="Social links">
      {% if site.email %}
        <a class="icon-link" href="mailto:{{ site.email }}" aria-label="Email" title="Email">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M4 4h16v16H4z" />
            <path d="m22 6-10 7L2 6" />
          </svg>
        </a>
      {% endif %}

      {% if site.github_url %}
        <a class="icon-link" href="{{ site.github_url }}" aria-label="GitHub" title="GitHub" target="_blank" rel="noopener noreferrer">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M9 19c-4 1.5-4-2.5-6-3m12 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 19 4.77 5.07 5.07 0 0 0 18.91 1S17.73.65 15 2.48a13.38 13.38 0 0 0-6 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" />
          </svg>
        </a>
      {% endif %}

      {% if site.inspire_url %}
        <a class="icon-link" href="{{ site.inspire_url }}" aria-label="Inspire" title="Inspire" target="_blank" rel="noopener noreferrer">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M2 4h8a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
            <path d="M22 4h-8a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h9z" />
          </svg>
        </a>
      {% endif %}
    </div>
  </div>
</header>
